<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Item Shop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Galmuri9&display=swap');

        :root {
            --bg-color: #ffffff;
            --window-bg: #fdfdfd;
            --highlight: #ffffff;
            --shadow: #b0b0c0;
            --dark-shadow: #8a8a9b;
            --title-start: #a1c4fd;
            --title-end: #c2e9fb;
            --accent-color: #ffb7b2; 
            
            --radius-outer: 12px;
            --radius-inner: 8px;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Galmuri9', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .window {
            background-color: var(--window-bg);
            width: 340px;
            padding: 6px;
            border-radius: var(--radius-outer);
            box-shadow: inset -1px -1px var(--dark-shadow), 
                        inset 1px 1px var(--highlight), 
                        inset -2px -2px var(--shadow), 
                        inset 2px 2px #ffffff;
            filter: drop-shadow(8px 8px 15px rgba(100, 100, 100, 0.15));
            display: flex;
            flex-direction: column;
        }

        .title-bar {
            background: linear-gradient(90deg, var(--title-start), var(--title-end));
            padding: 6px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-radius: var(--radius-inner) var(--radius-inner) 4px 4px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .title-bar-text {
            color: #556677;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
        }

        .title-bar-controls { display: flex; gap: 4px; }

        .btn-win {
            background: var(--window-bg);
            width: 16px;
            height: 16px;
            border: 1px solid #aaa;
            border-radius: 4px; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            color: #888;
            cursor: pointer;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .content-area {
            background: #fffafa;
            border-radius: var(--radius-inner);
            border: 2px inset #eee;
            box-shadow: inset 1px 1px 6px rgba(0,0,0,0.05);
            height: 240px;
            padding: 12px;
            overflow-y: auto;
            
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            align-content: start;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { 
            background: #e0e0e0; border-radius: 4px;
        }

        .shop-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            background: white;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .shop-item:hover { 
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        .shop-item.selected {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
        }

        .item-image {
            width: 50px;
            height: 50px;
            background-color: #f8f8f8;
            border-radius: 6px;
            margin-bottom: 6px;
            object-fit: cover;
            border: 1px solid #eee;
        }

        .item-name {
            font-size: 11px;
            margin-bottom: 4px;
            text-align: center;
            word-break: keep-all;
            line-height: 1.3;
            color: #555;
        }
        
        .item-price {
            font-size: 10px;
            color: #888;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        .shop-item.selected .item-name { color: white; font-weight: bold; }
        .shop-item.selected .item-price { color: rgba(255,255,255,0.9); }

        .loading { grid-column: 1 / -1; text-align: center; margin-top: 60px; color: #aaa; font-size: 12px; }
        
        .control-panel {
            margin-top: 8px;
            padding: 8px;
            background: #f0f4f8;
            border-radius: var(--radius-inner);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid white;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.05);
        }

        /* [수정] 자동 동기화 표시 (애니메이션) */
        .sync-indicator {
            width: 8px; height: 8px; border-radius: 50%;
            background-color: #aaa; margin-left: 6px;
            transition: background-color 0.3s;
        }
        .sync-active { background-color: #4caf50; box-shadow: 0 0 5px #4caf50; }

        .total-label { font-size: 11px; color: #556677; font-weight: bold; cursor: help; display: flex; align-items: center; }
        .total-price { font-size: 14px; font-weight: bold; color: #e91e63; margin-left: 4px; }

        .btn-group { display: flex; gap: 6px; }

        .action-btn {
            padding: 4px 10px;
            font-family: 'Galmuri9';
            font-size: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            transition: all 0.1s;
        }

        .btn-buy { background: #ffb7b2; color: white; font-weight: bold; width: 100%; }

        .action-btn:active {
            transform: translate(1px, 1px);
            box-shadow: none;
        }
        
        .error-msg {
            grid-column: 1 / -1; color: #e57373; text-align: center; font-size: 11px;
            padding: 10px; background: #ffebee; border: 1px solid #ef9a9a; border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="window">
        <div class="title-bar">
            <div class="title-bar-text">♥ PASTEL_SHOP.exe</div>
            <div class="title-bar-controls">
                <div class="btn-win">_</div>
                <div class="btn-win">□</div>
                <div class="btn-win">x</div>
            </div>
        </div>
        
        <div class="content-area" id="itemList">
            <div class="loading">
                로딩중...<br>
                ☁ ☁ ☁
            </div>
        </div>
        
        <div class="control-panel">
            <div class="total-section">
                <!-- 자동 동기화 상태 표시등 추가 -->
                <span class="total-label" onclick="showDebugInfo()">
                    GOLD
                    <div class="sync-indicator" id="syncDot" title="자동 동기화 중"></div>:
                </span>
                <span class="total-price" id="balanceDisplay">--</span>
            </div>
            <div class="btn-group">
                <button class="action-btn btn-buy" onclick="purchase()">구매하기</button>
            </div>
        </div>
    </div>

    <script>
        const itemListElement = document.getElementById('itemList');
        const balanceDisplayElement = document.getElementById('balanceDisplay');
        const syncDot = document.getElementById('syncDot');

        // ============================================================
        // [설정 구역]
        // ============================================================
        const COLUMN_NAME = 'item';   
        const COLUMN_PRICE = 'Price'; 
        const COLUMN_IMAGE = 'Image';
        const COLUMN_REMAINING = 'GOLD'; 
        
        // [설정] 자동 업데이트 주기 (밀리초 단위, 2000 = 2초)
        const UPDATE_INTERVAL = 2000; 
        // ============================================================

        let selectedItemsTotal = 0;
        let selectedItemNames = new Set(); // 선택된 아이템의 이름을 기억하는 저장소
        let lastDebugInfo = "데이터 로딩 전";

        function getSafeNumber(prop) {
            if (!prop) return 0;
            if (prop.type === 'number') return prop.number || 0;
            if (prop.type === 'formula') {
                if (prop.formula.type === 'number') return prop.formula.number || 0;
                if (prop.formula.type === 'string') return parseFloat(prop.formula.string) || 0;
            }
            if (prop.type === 'rollup') {
                if (prop.rollup.type === 'number') return prop.rollup.number || 0;
                if (prop.rollup.type === 'array') {
                    const validItem = prop.rollup.array.find(item => 
                        (item.type === 'number' && item.number > 0) || 
                        (item.type === 'formula' && item.formula.number > 0)
                    );
                    if (validItem) {
                         if (validItem.type === 'number') return validItem.number;
                         if (validItem.type === 'formula') return validItem.formula.number;
                    }
                    return 0;
                }
            }
            return 0;
        }

        async function fetchItems(isAutoUpdate = false) {
            try {
                // 자동 업데이트 중일 때는 초록색 불 켜기
                if (isAutoUpdate) syncDot.classList.add('sync-active');

                const timestamp = new Date().getTime();
                const response = await fetch(`api/notion?t=${timestamp}`); 
                
                if (!response.ok) throw new Error(`서버 연결 실패 (${response.status})`);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    renderItems(data.results);
                    
                    // GOLD 찾기 로직
                    let foundMoney = 0;
                    let debugStatus = "값을 찾지 못함";

                    for (let i = 0; i < data.results.length; i++) {
                        const item = data.results[i];
                        const remainingProp = item.properties[COLUMN_REMAINING];
                        
                        if (remainingProp) {
                            const val = getSafeNumber(remainingProp);
                            if (val > 0) {
                                foundMoney = val;
                                debugStatus = `성공! ${i+1}번째 아이템에서 값 ${val} 발견`;
                                break;
                            }
                        }
                    }

                    if (foundMoney === 0) {
                        const firstItemProps = data.results[0].properties;
                        if (!firstItemProps[COLUMN_REMAINING]) {
                            debugStatus = `실패: '${COLUMN_REMAINING}' 속성 없음`;
                        } else {
                            debugStatus = `실패: 값이 0이거나 비어있음`;
                        }
                    }
                    
                    lastDebugInfo = debugStatus;
                    balanceDisplayElement.innerText = `₩${foundMoney.toLocaleString()}`;

                } else if (data.results && data.results.length === 0) {
                    if (!isAutoUpdate) itemListElement.innerHTML = `<div class="loading">아이템이 없습니다.</div>`;
                }

            } catch (error) {
                console.error(error);
                if (!isAutoUpdate) itemListElement.innerHTML = `<div class="error-msg">API 호출 실패</div>`;
            } finally {
                // 업데이트 끝나면 불 끄기
                setTimeout(() => syncDot.classList.remove('sync-active'), 500);
            }
        }

        window.showDebugInfo = function() {
            if (document.getElementById('balanceDisplay').innerText === '₩0') {
                alert(`[디버깅 정보]\n${lastDebugInfo}`);
            }
        }

        function renderItems(data) {
            // [원리] 기존에 선택된 아이템 목록을 백업해둡니다. (Set은 중복없는 목록)
            // 현재 화면에 있는 'selected' 클래스 가진 아이템들의 이름을 저장
            // (fetchItems가 잦아서 중간에 선택이 풀리는 것을 방지하기 위함이지만,
            //  더 확실하게 하기 위해 전역 변수 selectedItemNames를 사용합니다.)
            
            // 화면 초기화
            itemListElement.innerHTML = '';
            
            // 다시 렌더링 할 때 전역 변수 selectedItemsTotal를 0으로 초기화하고 재계산
            // (가격 변동이 있을 수 있으므로)
            let tempTotal = 0;

            data.forEach(item => {
                const name = item.properties[COLUMN_NAME]?.title[0]?.plain_text || "이름 없음";
                const price = item.properties[COLUMN_PRICE]?.number || 0;
                
                let imageUrl = "https://via.placeholder.com/50/ffebee/e57373?text=♥";
                const imageProp = item.properties[COLUMN_IMAGE];
                if (imageProp?.files && imageProp.files.length > 0) {
                    imageUrl = imageProp.files[0].file?.url || imageProp.files[0].external?.url;
                }

                const div = document.createElement('div');
                div.className = 'shop-item';
                div.innerHTML = `
                    <img src="${imageUrl}" class="item-image" alt="${name}" onerror="this.src='https://via.placeholder.com/50/eee/aaa?text=x'">
                    <span class="item-name">${name}</span>
                    <span class="item-price">₩${price.toLocaleString()}</span>
                `;

                // [원리] 기억해둔 이름 목록에 이 아이템이 있다면, 다시 선택 상태로 만듦
                if (selectedItemNames.has(name)) {
                    div.classList.add('selected');
                    tempTotal += price;
                }

                div.addEventListener('click', () => {
                    div.classList.toggle('selected');
                    const isSelected = div.classList.contains('selected');

                    if (isSelected) {
                        selectedItemNames.add(name); // 이름 기억
                        selectedItemsTotal += price;
                    } else {
                        selectedItemNames.delete(name); // 이름 망각
                        selectedItemsTotal -= price;
                    }
                    
                    // 재계산 로직이 꼬일 수 있으므로, 확실하게 다시 계산
                    // (여기서는 간단히 처리)
                });

                itemListElement.appendChild(div);
            });

            // 가격 재동기화
            selectedItemsTotal = tempTotal;
        }

        function purchase() {
            if (selectedItemsTotal === 0) {
                alert("장바구니가 텅 비었어요! 아이템을 골라주세요.");
            } else {
                alert(`선택하신 상품의 총 금액은 ${selectedItemsTotal.toLocaleString()}원 입니다.\n구매를 진행하시겠습니까?`);
                
                const allItems = document.querySelectorAll('.shop-item');
                allItems.forEach(item => item.classList.remove('selected'));
                
                selectedItemsTotal = 0;
                selectedItemNames.clear(); // 기억소 초기화
            }
        }

        // 1. 최초 실행
        fetchItems();

        // 2. [핵심] 2초마다 자동으로 실행 (Polling)
        setInterval(() => {
            fetchItems(true); // true는 자동 업데이트라는 표시
        }, UPDATE_INTERVAL);

    </script>
</body>
</html>
