<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Item Shop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Galmuri9&display=swap');

        :root {
            --bg-color: #ffffff;
            --window-bg: #fdfdfd;
            --highlight: #ffffff;
            --shadow: #b0b0c0;
            --dark-shadow: #8a8a9b;
            --title-start: #a1c4fd;
            --title-end: #c2e9fb;
            --accent-color: #ffb7b2; 
            
            --radius-outer: 12px;
            --radius-inner: 8px;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Galmuri9', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .window {
            background-color: var(--window-bg);
            width: 340px;
            padding: 6px;
            border-radius: var(--radius-outer);
            box-shadow: inset -1px -1px var(--dark-shadow), 
                        inset 1px 1px var(--highlight), 
                        inset -2px -2px var(--shadow), 
                        inset 2px 2px #ffffff;
            filter: drop-shadow(8px 8px 15px rgba(100, 100, 100, 0.15));
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        .title-bar {
            background: linear-gradient(90deg, var(--title-start), var(--title-end));
            padding: 6px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-radius: var(--radius-inner) var(--radius-inner) 4px 4px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .title-bar-text {
            color: #556677;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
        }

        .title-bar-controls { display: flex; gap: 4px; }

        .btn-win {
            background: var(--window-bg);
            width: 16px;
            height: 16px;
            border: 1px solid #aaa;
            border-radius: 4px; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            color: #888;
            cursor: pointer;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .content-area {
            background: #fffafa;
            border-radius: var(--radius-inner);
            border: 2px inset #eee;
            box-shadow: inset 1px 1px 6px rgba(0,0,0,0.05);
            height: 240px;
            padding: 12px;
            overflow-y: auto;
            
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            align-content: start;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { 
            background: #e0e0e0; border-radius: 4px;
        }

        .shop-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            background: white;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .shop-item:hover { 
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        .shop-item.selected {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
        }

        .item-image {
            width: 50px;
            height: 50px;
            background-color: #f8f8f8;
            border-radius: 6px;
            margin-bottom: 6px;
            object-fit: cover;
            border: 1px solid #eee;
        }

        .item-name {
            font-size: 11px;
            margin-bottom: 4px;
            text-align: center;
            word-break: keep-all;
            line-height: 1.3;
            color: #555;
        }
        
        .item-price {
            font-size: 10px;
            color: #888;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        .shop-item.selected .item-name { color: white; font-weight: bold; }
        .shop-item.selected .item-price { color: rgba(255,255,255,0.9); }

        .loading { grid-column: 1 / -1; text-align: center; margin-top: 60px; color: #aaa; font-size: 12px; }
        
        .control-panel {
            margin-top: 8px;
            padding: 8px;
            background: #f0f4f8;
            border-radius: var(--radius-inner);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid white;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.05);
        }

        .sync-indicator {
            width: 8px; height: 8px; border-radius: 50%;
            background-color: #aaa; margin-left: 6px;
            transition: background-color 0.3s;
        }
        .sync-active { background-color: #4caf50; box-shadow: 0 0 5px #4caf50; }

        .total-label { font-size: 11px; color: #556677; font-weight: bold; cursor: help; display: flex; align-items: center; }
        .total-price { font-size: 14px; font-weight: bold; color: #e91e63; margin-left: 4px; cursor: help; } /* 디버깅 위해 커서 변경 */

        .btn-group { display: flex; gap: 6px; }

        .action-btn {
            padding: 4px 10px;
            font-family: 'Galmuri9';
            font-size: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            transition: all 0.1s;
        }

        .btn-buy { background: #ffb7b2; color: white; font-weight: bold; width: 100%; }

        .action-btn:active {
            transform: translate(1px, 1px);
            box-shadow: none;
        }
        
        .error-msg {
            grid-column: 1 / -1; color: #e57373; text-align: center; font-size: 11px;
            padding: 10px; background: #ffebee; border: 1px solid #ef9a9a; border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="window">
        <div class="title-bar">
            <div class="title-bar-text">♥ PASTEL_SHOP.exe</div>
            <div class="title-bar-controls">
                <div class="btn-win">_</div>
                <div class="btn-win">□</div>
                <div class="btn-win">x</div>
            </div>
        </div>
        
        <div class="content-area" id="itemList">
            <div class="loading">
                로딩중...<br>
                ☁ ☁ ☁
            </div>
        </div>
        
        <div class="control-panel">
            <div class="total-section">
                <!-- GOLD 라벨 클릭 시 진단 정보 출력 -->
                <span class="total-label" onclick="showDebugInfo()" title="클릭해서 진단 정보 보기">
                    GOLD ❓:
                </span>
                <span class="total-price" id="balanceDisplay" onclick="showDebugInfo()">--</span>
            </div>
            <div class="btn-group">
                <button class="action-btn btn-buy" onclick="purchase()">구매하기</button>
            </div>
        </div>
    </div>

    <script>
        const itemListElement = document.getElementById('itemList');
        const balanceDisplayElement = document.getElementById('balanceDisplay');
        const syncDot = document.getElementById('syncDot');

        // ============================================================
        // [설정 구역]
        // ============================================================
        const COLUMN_NAME = 'item';   
        const COLUMN_PRICE = 'Price'; 
        const COLUMN_IMAGE = 'Image';
        const COLUMN_REMAINING = 'GOLD'; 
        // ============================================================

        let selectedItemsTotal = 0;
        let selectedItemNames = new Set(); 
        
        // [진단용 변수] : 여기에 노션 원본 데이터를 담아서 보여줍니다.
        let debugInfo = {
            status: "초기화 전",
            allKeys: [],
            targetProp: null,
            foundValue: 0
        };

        function getSafeNumber(prop) {
            if (!prop) return 0;
            const extractNum = (val) => {
                if (typeof val === 'number') return val;
                if (!val) return 0;
                // 문자열에서 숫자만 추출
                const str = String(val).replace(/[^0-9.-]/g, '');
                return parseFloat(str) || 0;
            };
            
            // 1. 숫자 타입
            if (prop.type === 'number') return extractNum(prop.number);
            
            // 2. 수식 타입
            if (prop.type === 'formula') {
                if (prop.formula.type === 'number') return extractNum(prop.formula.number);
                if (prop.formula.type === 'string') return extractNum(prop.formula.string);
            }
            
            // 3. 롤업 타입
            if (prop.type === 'rollup') {
                if (prop.rollup.type === 'number') return extractNum(prop.rollup.number);
                
                if (prop.rollup.type === 'array') {
                    for (const item of prop.rollup.array) {
                        let val = 0;
                        if (item.type === 'number') val = extractNum(item.number);
                        else if (item.type === 'formula') {
                            if (item.formula.type === 'number') val = extractNum(item.formula.number);
                            else if (item.formula.type === 'string') val = extractNum(item.formula.string);
                        }
                        else if (item.type === 'rich_text' && item.rich_text.length > 0) {
                            val = extractNum(item.rich_text[0].plain_text);
                        }
                        if (val !== 0) return val;
                    }
                }
            }
            return 0;
        }

        async function fetchItems() {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`api/notion?t=${timestamp}`); 
                
                if (!response.ok) throw new Error(`서버 연결 실패 (${response.status})`);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    renderItems(data.results);
                    
                    // ====================================================
                    // [진단 모드] 노션 데이터 정밀 분석
                    // ====================================================
                    const firstItem = data.results[0]; // 첫 번째 아이템 기준
                    
                    // 1. 현재 이 아이템이 가진 모든 속성 이름 수집 (오타 확인용)
                    debugInfo.allKeys = Object.keys(firstItem.properties);
                    
                    // 2. 우리가 찾는 'GOLD' 속성이 있는지 확인
                    const targetProp = firstItem.properties[COLUMN_REMAINING];
                    debugInfo.targetProp = targetProp ? targetProp : "없음 (NULL)";
                    
                    // 3. 값 추출 시도
                    let foundMoney = 0;
                    
                    // 모든 아이템을 순회하며 값을 찾습니다.
                    for (let i = 0; i < data.results.length; i++) {
                        const prop = data.results[i].properties[COLUMN_REMAINING];
                        if (prop) {
                            const val = getSafeNumber(prop);
                            if (val > 0) {
                                foundMoney = val;
                                // 값을 찾은 시점의 데이터를 디버그 정보에 저장 (성공 케이스)
                                debugInfo.status = `성공! ${i+1}번째 아이템에서 발견`;
                                debugInfo.targetProp = prop; // 실제 값을 찾은 그 속성으로 업데이트
                                break;
                            }
                        }
                    }

                    if (foundMoney === 0) {
                        debugInfo.status = "실패: 모든 아이템을 뒤져도 0원만 나옵니다.";
                    }

                    debugInfo.foundValue = foundMoney;
                    balanceDisplayElement.innerText = `₩${foundMoney.toLocaleString()}`;

                } else if (data.results && data.results.length === 0) {
                    itemListElement.innerHTML = `<div class="loading">아이템이 없습니다.</div>`;
                }

            } catch (error) {
                console.error(error);
                itemListElement.innerHTML = `<div class="error-msg">API 호출 실패</div>`;
            }
        }

        function renderItems(data) {
            itemListElement.innerHTML = '';
            let tempTotal = 0;

            data.forEach(item => {
                const name = item.properties[COLUMN_NAME]?.title[0]?.plain_text || "이름 없음";
                const price = item.properties[COLUMN_PRICE]?.number || 0;
                
                let imageUrl = "https://via.placeholder.com/50/ffebee/e57373?text=♥";
                const imageProp = item.properties[COLUMN_IMAGE];
                if (imageProp?.files && imageProp.files.length > 0) {
                    imageUrl = imageProp.files[0].file?.url || imageProp.files[0].external?.url;
                }

                const div = document.createElement('div');
                div.className = 'shop-item';
                div.innerHTML = `
                    <img src="${imageUrl}" class="item-image" alt="${name}" onerror="this.src='https://via.placeholder.com/50/eee/aaa?text=x'">
                    <span class="item-name">${name}</span>
                    <span class="item-price">₩${price.toLocaleString()}</span>
                `;

                if (selectedItemNames.has(name)) {
                    div.classList.add('selected');
                    tempTotal += price;
                }

                div.addEventListener('click', () => {
                    div.classList.toggle('selected');
                    const isSelected = div.classList.contains('selected');

                    if (isSelected) {
                        selectedItemNames.add(name);
                        selectedItemsTotal += price;
                    } else {
                        selectedItemNames.delete(name);
                        selectedItemsTotal -= price;
                    }
                });

                itemListElement.appendChild(div);
            });

            selectedItemsTotal = tempTotal;
        }

        function purchase() {
            if (selectedItemsTotal === 0) {
                alert("장바구니가 텅 비었어요! 아이템을 골라주세요.");
            } else {
                alert(`선택하신 상품의 총 금액은 ${selectedItemsTotal.toLocaleString()}원 입니다.\n구매를 진행하시겠습니까?`);
                const allItems = document.querySelectorAll('.shop-item');
                allItems.forEach(item => item.classList.remove('selected'));
                selectedItemsTotal = 0;
                selectedItemNames.clear();
            }
        }

        // ============================================================
        // [진단 도구] GOLD 클릭 시 실행되는 함수
        // ============================================================
        window.showDebugInfo = function() {
            let msg = "[🔍 노션 데이터 진단 리포트]\n\n";

            // 1. 속성 이름 확인
            if (debugInfo.allKeys.includes(COLUMN_REMAINING)) {
                msg += `✅ '${COLUMN_REMAINING}' 속성을 찾았습니다!\n`;
            } else {
                msg += `❌ '${COLUMN_REMAINING}' 속성이 없습니다.\n`;
                msg += `(현재 있는 속성들: ${debugInfo.allKeys.join(', ')})\n\n`;
                msg += "💡 해결책: 코드 상단의 COLUMN_REMAINING 값을 노션 속성 이름과 똑같이(띄어쓰기 포함) 맞춰주세요.\n";
            }

            msg += "--------------------------------\n";

            // 2. 속성 데이터 구조 확인
            if (debugInfo.targetProp === "없음 (NULL)") {
                msg += "데이터가 비어있습니다.\n";
            } else {
                msg += `📂 데이터 타입: ${debugInfo.targetProp.type}\n`;
                msg += `📄 원본 데이터(JSON):\n${JSON.stringify(debugInfo.targetProp, null, 2)}\n`;
            }

            msg += "--------------------------------\n";
            msg += `💰 최종 추출된 값: ${debugInfo.foundValue}`;

            // alert 창은 너무 길면 잘릴 수 있으니 콘솔에도 출력
            console.log(msg);
            alert(msg);
        }

        // 최초 실행
        fetchItems();

    </script>
</body>
</html>
