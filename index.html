<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Item Shop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Galmuri9&display=swap');

        :root {
            --bg-color: #008080;
            --window-bg: #c0c0c0;
            --highlight: #ffffff;
            --shadow: #808080;
            --dark-shadow: #000000;
            --win-blue: #000080;
            --radius-outer: 12px;
            --radius-inner: 8px;
        }

        body {
            background-color: transparent;
            font-family: 'Galmuri9', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .window {
            background-color: var(--window-bg);
            width: 320px;
            padding: 4px;
            border-radius: var(--radius-outer);
            box-shadow: inset -1px -1px var(--dark-shadow), 
                        inset 1px 1px var(--highlight), 
                        inset -2px -2px var(--shadow), 
                        inset 2px 2px #dfdfdf;
            filter: drop-shadow(4px 4px 10px rgba(0,0,0,0.3));
            display: flex;
            flex-direction: column;
        }

        .title-bar {
            background: linear-gradient(90deg, var(--win-blue), #1084d0);
            padding: 4px 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            border-radius: var(--radius-inner) var(--radius-inner) 2px 2px;
            flex-shrink: 0;
        }

        .title-bar-text {
            color: white;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            margin-left: 2px;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.5);
        }

        .title-bar-controls { display: flex; gap: 2px; }

        .btn {
            background: var(--window-bg);
            width: 16px;
            height: 14px;
            border: 1px solid;
            border-color: var(--highlight) var(--dark-shadow) var(--dark-shadow) var(--highlight);
            box-shadow: 1px 1px 0px 0px black;
            font-size: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: black;
        }

        .btn:active {
            border-color: var(--dark-shadow) var(--highlight) var(--highlight) var(--dark-shadow);
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        .content-area {
            background: white;
            border-radius: var(--radius-inner);
            border: 2px inset #dfdfdf;
            box-shadow: inset 1px 1px 4px rgba(0,0,0,0.1);
            height: 220px;
            padding: 10px;
            overflow-y: auto;
            
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            align-content: start;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #dfdfdf; border-radius: 0 0 var(--radius-inner) 0; }
        ::-webkit-scrollbar-thumb { 
            background: #c0c0c0; border: 1px solid white; box-shadow: inset -1px -1px black;
        }

        .shop-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px;
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.1s;
        }

        .shop-item:hover { border: 1px dotted #888; }

        .shop-item.selected {
            background-color: var(--win-blue);
            color: white;
            border: 1px solid var(--win-blue);
            box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .item-image {
            width: 48px;
            height: 48px;
            background-color: #eee;
            border-radius: 4px;
            margin-bottom: 6px;
            object-fit: cover;
            border: 2px inset #fff;
        }

        .item-name {
            font-size: 11px;
            margin-bottom: 4px;
            text-align: center;
            word-break: keep-all;
            line-height: 1.2;
        }

        .item-price {
            font-size: 10px;
            color: #666;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }
        
        .shop-item.selected .item-name { color: white; font-weight: bold; }
        .shop-item.selected .item-price { color: #ffeb3b; }

        .loading { grid-column: 1 / -1; text-align: center; margin-top: 40px; color: #888; }
        
        .status-bar {
            margin-top: 6px; 
            padding: 2px 6px; 
            font-size: 11px; 
            color: #333; 
            background: #dfdfdf;
            border: 1px inset white;
            display: flex; 
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        
        .error-msg {
            grid-column: 1 / -1; color: red; text-align: center; font-size: 11px;
            padding: 10px; background: #ffe6e6; border: 1px solid red; border-radius: 4px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="window">
        <div class="title-bar">
            <div class="title-bar-text">ITEM_SHOP.EXE</div>
            <div class="title-bar-controls">
                <div class="btn">_</div>
                <div class="btn">□</div>
                <div class="btn">X</div>
            </div>
        </div>
        
        <div class="content-area" id="itemList">
            <div class="loading">Loading...</div>
        </div>
        
        <div class="status-bar">
            <span>TOTAL:</span>
            <span id="totalPrice">₩0</span>
        </div>
    </div>

    <script>
        const itemListElement = document.getElementById('itemList');
        const totalPriceElement = document.getElementById('totalPrice');

        // ============================================================
        // [★수정구역] 내 노션 데이터베이스 속성 이름 확인!
        // ============================================================
        
        const COLUMN_NAME = 'Name';   // 아이템 이름
        const COLUMN_PRICE = 'Price'; // 가격 (숫자)
        const COLUMN_IMAGE = 'Image'; // 이미지 (선택사항)

        // ============================================================

        let currentTotal = 0;

        async function fetchItems() {
            try {
                // api/notion 호출 (앞에 슬래시 뺌)
                const response = await fetch('api/notion'); 
                
                if (!response.ok) throw new Error(`서버 에러 (${response.status})`);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    renderItems(data.results);
                } else if (data.results && data.results.length === 0) {
                    itemListElement.innerHTML = `<div class="loading">아이템이 없습니다.<br>(노션 표가 비어있음)</div>`;
                } else if (data.object === 'error') {
                    // [에러 원인 상세 출력]
                    // 노션이 보낸 진짜 에러 메시지를 보여줍니다.
                    itemListElement.innerHTML = `
                        <div class="error-msg">
                            <strong>노션 연결 거부 (${data.status})</strong><br>
                            ${data.message}<br><br>
                            <span style="color:#666">
                            [힌트]<br>
                            401: Vercel 환경변수 키 확인<br>
                            404: DB ID 확인 또는 초대 안됨
                            </span>
                        </div>`;
                } else {
                    itemListElement.innerHTML = `<div class="error-msg">알 수 없는 데이터<br>${JSON.stringify(data)}</div>`;
                }

            } catch (error) {
                console.error(error);
                itemListElement.innerHTML = `<div class="error-msg">${error.message}</div>`;
            }
        }

        function renderItems(data) {
            itemListElement.innerHTML = '';
            
            data.forEach(item => {
                // 데이터 안전하게 꺼내기
                const name = item.properties[COLUMN_NAME]?.title[0]?.plain_text || "이름 없음";
                const price = item.properties[COLUMN_PRICE]?.number || 0;
                
                let imageUrl = "https://via.placeholder.com/48?text=Item";
                const imageProp = item.properties[COLUMN_IMAGE];
                if (imageProp?.files && imageProp.files.length > 0) {
                    imageUrl = imageProp.files[0].file?.url || imageProp.files[0].external?.url;
                }

                const div = document.createElement('div');
                div.className = 'shop-item';
                div.innerHTML = `
                    <img src="${imageUrl}" class="item-image" alt="${name}" onerror="this.src='https://via.placeholder.com/48?text=Error'">
                    <span class="item-name">${name}</span>
                    <span class="item-price">₩${price.toLocaleString()}</span>
                `;

                // 클릭 이벤트 (합계 계산)
                div.addEventListener('click', () => {
                    div.classList.toggle('selected');
                    const isSelected = div.classList.contains('selected');

                    if (isSelected) currentTotal += price;
                    else currentTotal -= price;

                    totalPriceElement.innerText = `₩${currentTotal.toLocaleString()}`;
                });

                itemListElement.appendChild(div);
            });
        }

        fetchItems();
    </script>
</body>
</html>
