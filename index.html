<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Item Shop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Galmuri9&display=swap');

        :root {
            /* [수정] 배경: 흰색으로 변경 */
            --bg-color: #ffffff;
            /* 창 배경: 아주 연한 회색/흰색 */
            --window-bg: #fdfdfd;
            /* 하이라이트: 흰색 */
            --highlight: #ffffff;
            /* 그림자: 진한 검정 대신 연한 보라빛 회색 사용 */
            --shadow: #b0b0c0;
            --dark-shadow: #8a8a9b;
            /* 타이틀바 그라데이션: 파스텔 블루 -> 핑크 */
            --title-start: #a1c4fd;
            --title-end: #c2e9fb;
            /* 포인트 컬러 (선택 시) */
            --accent-color: #ffb7b2; 
            
            --radius-outer: 12px;
            --radius-inner: 8px;
        }

        body {
            background-color: var(--bg-color);
            /* [수정] 도트 패턴 제거 (background-image, background-size 삭제) */
            font-family: 'Galmuri9', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .window {
            background-color: var(--window-bg);
            width: 340px;
            padding: 6px;
            border-radius: var(--radius-outer);
            box-shadow: inset -1px -1px var(--dark-shadow), 
                        inset 1px 1px var(--highlight), 
                        inset -2px -2px var(--shadow), 
                        inset 2px 2px #ffffff;
            filter: drop-shadow(8px 8px 15px rgba(100, 100, 100, 0.15));
            display: flex;
            flex-direction: column;
        }

        .title-bar {
            background: linear-gradient(90deg, var(--title-start), var(--title-end));
            padding: 6px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-radius: var(--radius-inner) var(--radius-inner) 4px 4px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .title-bar-text {
            color: #556677;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
        }

        .title-bar-controls { display: flex; gap: 4px; }

        .btn-win {
            background: var(--window-bg);
            width: 16px;
            height: 16px;
            border: 1px solid #aaa;
            border-radius: 4px; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            color: #888;
            cursor: pointer;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .content-area {
            background: #fffafa;
            border-radius: var(--radius-inner);
            border: 2px inset #eee;
            box-shadow: inset 1px 1px 6px rgba(0,0,0,0.05);
            height: 240px;
            padding: 12px;
            overflow-y: auto;
            
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            align-content: start;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { 
            background: #e0e0e0; border-radius: 4px;
        }

        .shop-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            background: white;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .shop-item:hover { 
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        .shop-item.selected {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
        }

        .item-image {
            width: 50px;
            height: 50px;
            background-color: #f8f8f8;
            border-radius: 6px;
            margin-bottom: 6px;
            object-fit: cover;
            border: 1px solid #eee;
        }

        .item-name {
            font-size: 11px;
            margin-bottom: 4px;
            text-align: center;
            word-break: keep-all;
            line-height: 1.3;
            color: #555;
        }
        
        .item-price {
            font-size: 10px;
            color: #888;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        .shop-item.selected .item-name { color: white; font-weight: bold; }
        .shop-item.selected .item-price { color: rgba(255,255,255,0.9); }

        .loading { grid-column: 1 / -1; text-align: center; margin-top: 60px; color: #aaa; font-size: 12px; }
        
        .control-panel {
            margin-top: 8px;
            padding: 8px;
            background: #f0f4f8;
            border-radius: var(--radius-inner);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid white;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.05);
        }

        /* 라벨 텍스트 색상 변경 */
        .total-label { font-size: 11px; color: #556677; font-weight: bold; cursor: help; }
        .total-price { font-size: 14px; font-weight: bold; color: #e91e63; margin-left: 4px; }

        .btn-group { display: flex; gap: 6px; }

        .action-btn {
            padding: 4px 10px;
            font-family: 'Galmuri9';
            font-size: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            transition: all 0.1s;
        }

        /* [수정] 초기화 버튼 스타일 삭제됨, 구매 버튼만 남음 */
        .btn-buy { background: #ffb7b2; color: white; font-weight: bold; width: 100%; }

        .action-btn:active {
            transform: translate(1px, 1px);
            box-shadow: none;
        }
        
        .error-msg {
            grid-column: 1 / -1; color: #e57373; text-align: center; font-size: 11px;
            padding: 10px; background: #ffebee; border: 1px solid #ef9a9a; border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="window">
        <div class="title-bar">
            <div class="title-bar-text">♥ PASTEL_SHOP.exe</div>
            <div class="title-bar-controls">
                <div class="btn-win">_</div>
                <div class="btn-win">□</div> <!-- 버튼 모양 텍스트도 살짝 변경 -->
                <div class="btn-win">x</div>
            </div>
        </div>
        
        <div class="content-area" id="itemList">
            <div class="loading">
                로딩중...<br>
                ☁ ☁ ☁
            </div>
        </div>
        
        <div class="control-panel">
            <div class="total-section">
                <!-- [수정] 라벨을 GOLD로 변경 -->
                <span class="total-label" onclick="showDebugInfo()">GOLD:</span>
                <span class="total-price" id="balanceDisplay">--</span>
            </div>
            <div class="btn-group">
                <!-- [수정] 초기화 버튼 삭제 -->
                <button class="action-btn btn-buy" onclick="purchase()">구매하기</button>
            </div>
        </div>
    </div>

    <script>
        const itemListElement = document.getElementById('itemList');
        const balanceDisplayElement = document.getElementById('balanceDisplay');

        // ============================================================
        // [설정 구역] 노션 데이터베이스 속성 이름
        // ============================================================
        const COLUMN_NAME = 'item';   
        const COLUMN_PRICE = 'Price'; 
        const COLUMN_IMAGE = 'Image';
        // [추가] 속성 이름 변경: 남은 돈 -> GOLD
        const COLUMN_REMAINING = 'GOLD'; 
        // ============================================================

        let selectedItemsTotal = 0;
        let lastDebugInfo = "데이터 로딩 전"; // 디버깅용 메시지 저장 변수

        // [New] 강력한 숫자 추출 함수
        function getSafeNumber(prop) {
            if (!prop) return 0;
            
            // 1. 일반 숫자 (Number)
            if (prop.type === 'number') return prop.number || 0;
            
            // 2. 수식 (Formula)
            if (prop.type === 'formula') {
                if (prop.formula.type === 'number') return prop.formula.number || 0;
                if (prop.formula.type === 'string') return parseFloat(prop.formula.string) || 0;
            }
            
            // 3. 롤업 (Rollup) - 중요!
            if (prop.type === 'rollup') {
                if (prop.rollup.type === 'number') return prop.rollup.number || 0;
                // 롤업이 배열(Array) 형태로 오는 경우 처리
                if (prop.rollup.type === 'array') {
                    // 배열 안에 있는 값들을 확인해서 숫자를 찾아냄
                    const validItem = prop.rollup.array.find(item => 
                        (item.type === 'number' && item.number > 0) || 
                        (item.type === 'formula' && item.formula.number > 0)
                    );
                    
                    if (validItem) {
                         if (validItem.type === 'number') return validItem.number;
                         if (validItem.type === 'formula') return validItem.formula.number;
                    }
                    return 0;
                }
            }
            return 0;
        }

        async function fetchItems() {
            try {
                const response = await fetch('api/notion'); 
                
                if (!response.ok) throw new Error(`서버 연결 실패 (${response.status})`);
                const data = await response.json();

                console.log("Notion Data:", data);

                if (data.results && data.results.length > 0) {
                    renderItems(data.results);
                    
                    // [강력해진 로직] 모든 아이템을 뒤져서 'GOLD'가 있는 행을 찾습니다.
                    let foundMoney = 0;
                    let debugStatus = "값을 찾지 못함";

                    for (let i = 0; i < data.results.length; i++) {
                        const item = data.results[i];
                        const remainingProp = item.properties[COLUMN_REMAINING];
                        
                        if (remainingProp) {
                            const val = getSafeNumber(remainingProp);
                            if (val > 0) {
                                foundMoney = val;
                                debugStatus = `성공! ${i+1}번째 아이템에서 값 ${val} 발견`;
                                break; // 값을 찾았으면 반복문 종료
                            }
                        }
                    }

                    // 찾은 값이 0이어도 속성 자체가 존재하는지 확인해 디버그 메시지 생성
                    if (foundMoney === 0) {
                        const firstItemProps = data.results[0].properties;
                        if (!firstItemProps[COLUMN_REMAINING]) {
                            debugStatus = `실패: '${COLUMN_REMAINING}' 속성을 찾을 수 없음. (속성 목록: ${Object.keys(firstItemProps).join(', ')})`;
                        } else {
                            debugStatus = `실패: 속성은 있으나 값이 0이거나 비어있음. (타입: ${firstItemProps[COLUMN_REMAINING].type})`;
                        }
                    }
                    
                    lastDebugInfo = debugStatus;
                    balanceDisplayElement.innerText = `₩${foundMoney.toLocaleString()}`;

                } else if (data.results && data.results.length === 0) {
                    itemListElement.innerHTML = `<div class="loading">아이템이 없습니다.<br>(텅 비었어요!)</div>`;
                } else if (data.object === 'error') {
                    itemListElement.innerHTML = `
                        <div class="error-msg">
                            <strong>연결 오류 ☁</strong><br>
                            ${data.message}
                        </div>`;
                } else {
                    itemListElement.innerHTML = `<div class="error-msg">데이터 오류</div>`;
                }

            } catch (error) {
                console.error(error);
                itemListElement.innerHTML = `<div class="error-msg">API 호출 실패<br>Vercel 환경인지 확인해주세요.</div>`;
            }
        }

        // 디버깅용 팝업 함수
        window.showDebugInfo = function() {
            if (document.getElementById('balanceDisplay').innerText === '₩0') {
                alert(`[디버깅 정보]\n${lastDebugInfo}\n\n팁: 노션의 '${COLUMN_REMAINING}' 속성 이름에 띄어쓰기가 있는지 확인해보세요!`);
            }
        }

        function renderItems(data) {
            itemListElement.innerHTML = '';
            
            data.forEach(item => {
                const name = item.properties[COLUMN_NAME]?.title[0]?.plain_text || "이름 없음";
                const price = item.properties[COLUMN_PRICE]?.number || 0;
                
                let imageUrl = "https://via.placeholder.com/50/ffebee/e57373?text=♥";
                const imageProp = item.properties[COLUMN_IMAGE];
                if (imageProp?.files && imageProp.files.length > 0) {
                    imageUrl = imageProp.files[0].file?.url || imageProp.files[0].external?.url;
                }

                const div = document.createElement('div');
                div.className = 'shop-item';
                div.innerHTML = `
                    <img src="${imageUrl}" class="item-image" alt="${name}" onerror="this.src='https://via.placeholder.com/50/eee/aaa?text=x'">
                    <span class="item-name">${name}</span>
                    <span class="item-price">₩${price.toLocaleString()}</span>
                `;

                div.addEventListener('click', () => {
                    div.classList.toggle('selected');
                    const isSelected = div.classList.contains('selected');

                    if (isSelected) selectedItemsTotal += price;
                    else selectedItemsTotal -= price;
                });

                itemListElement.appendChild(div);
            });
        }

        function purchase() {
            if (selectedItemsTotal === 0) {
                alert("장바구니가 텅 비었어요! 아이템을 골라주세요.");
            } else {
                alert(`선택하신 상품의 총 금액은 ${selectedItemsTotal.toLocaleString()}원 입니다.\n구매를 진행하시겠습니까?`);
                
                const allItems = document.querySelectorAll('.shop-item');
                allItems.forEach(item => item.classList.remove('selected'));
                selectedItemsTotal = 0;
            }
        }

        fetchItems();
    </script>
</body>
</html>
